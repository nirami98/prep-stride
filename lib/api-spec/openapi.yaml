openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: interviews
    description: Interview session management
  - name: answers
    description: Answer submission
  - name: feedback
    description: AI-generated feedback
  - name: analytics
    description: User analytics and history
  - name: plans
    description: Personalized interview study plans
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: List user interview sessions
      responses:
        "200":
          description: List of interview sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSession"
    post:
      operationId: createInterview
      tags: [interviews]
      summary: Start a new interview session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewBody"
      responses:
        "201":
          description: Created interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interviews/{id}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get a specific interview session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSessionDetail"
    patch:
      operationId: endInterview
      tags: [interviews]
      summary: End an interview session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interviews/{id}/next-question:
    get:
      operationId: getNextQuestion
      tags: [questions]
      summary: Get next question for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Next question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "204":
          description: No more questions available

  /interviews/{id}/answers:
    post:
      operationId: submitAnswer
      tags: [answers]
      summary: Submit an answer for a question in a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerBody"
      responses:
        "201":
          description: Saved answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"

  /interviews/{id}/feedback:
    get:
      operationId: getFeedback
      tags: [feedback]
      summary: Get feedback for an interview session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback for session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
    post:
      operationId: generateFeedback
      tags: [feedback]
      summary: Generate AI feedback for a completed interview session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"

  /interviews/{id}/transcribe:
    post:
      operationId: transcribeAnswer
      tags: [answers]
      summary: Transcribe an audio answer using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeAnswerBody"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get user's analytics overview
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/history:
    get:
      operationId: getAnalyticsHistory
      tags: [analytics]
      summary: Get user's interview history with scores
      responses:
        "200":
          description: Interview history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryItem"

  /plans:
    get:
      operationId: listInterviewPlans
      tags: [plans]
      summary: List the user's interview study plans
      responses:
        "200":
          description: Interview plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewPlan"
    post:
      operationId: createInterviewPlan
      tags: [plans]
      summary: Generate a personalized interview study plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequestBody"
      responses:
        "201":
          description: Generated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPlan"

  /plans/{id}:
    get:
      operationId: getInterviewPlan
      tags: [plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPlan"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InterviewSession:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        jobRole:
          type: string
        companyName:
          type: string
          nullable: true
        experienceLevel:
          type: string
          enum: [entry, mid, senior, lead]
        interviewRounds:
          type: integer
        roundDetails:
          type: string
          nullable: true
        difficulty:
          type: string
          enum: [easy, medium, hard]
        status:
          type: string
          enum: [generating, active, completed, failed]
        questionCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        score:
          type: number
          nullable: true
      required:
        - id
        - userId
        - jobRole
        - experienceLevel
        - interviewRounds
        - difficulty
        - status
        - questionCount
        - startedAt

    InterviewSessionDetail:
      allOf:
        - $ref: "#/components/schemas/InterviewSession"
        - type: object
          properties:
            answers:
              type: array
              items:
                $ref: "#/components/schemas/Answer"
            feedback:
              $ref: "#/components/schemas/Feedback"
              nullable: true

    CreateInterviewBody:
      type: object
      properties:
        jobRole:
          type: string
          minLength: 2
          maxLength: 120
        companyName:
          type: string
          maxLength: 120
        difficulty:
          type: string
          enum: [easy, medium, hard]
        experienceLevel:
          type: string
          enum: [entry, mid, senior, lead]
        questionCount:
          type: integer
          minimum: 1
          maximum: 10
        interviewRounds:
          type: integer
          minimum: 1
          maximum: 8
        roundDetails:
          type: string
          maxLength: 5000
        jobDescription:
          type: string
          maxLength: 30000
        jobDescriptionFile:
          $ref: "#/components/schemas/DocumentUpload"
        resumeFile:
          $ref: "#/components/schemas/DocumentUpload"
      required:
        - jobRole
        - difficulty
        - experienceLevel
        - interviewRounds

    PlanRequestBody:
      allOf:
        - $ref: "#/components/schemas/CreateInterviewBody"

    DocumentUpload:
      type: object
      properties:
        filename:
          type: string
          maxLength: 255
        mimeType:
          type: string
        base64:
          type: string
      required: [filename, mimeType, base64]

    Question:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        category:
          type: string
        roundName:
          type: string
        sequence:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
      required:
        - id
        - content
        - category
        - roundName
        - sequence
        - difficulty

    Answer:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        questionId:
          type: string
        question:
          $ref: "#/components/schemas/Question"
          nullable: true
        response:
          type: string
          minLength: 1
          maxLength: 12000
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - questionId
        - response
        - createdAt

    SubmitAnswerBody:
      type: object
      properties:
        questionId:
          type: string
        response:
          type: string
      required:
        - questionId
        - response

    TranscribeAnswerBody:
      type: object
      properties:
        audioBase64:
          type: string
          maxLength: 14000000
        mimeType:
          type: string
      required:
        - audioBase64
        - mimeType

    TranscriptionResult:
      type: object
      properties:
        transcript:
          type: string
      required:
        - transcript

    Feedback:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string
        categoryScores:
          type: array
          items:
            $ref: "#/components/schemas/CategoryScore"
        answerBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/AnswerScore"
        methodology:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - score
        - strengths
        - weaknesses
        - suggestions
        - categoryScores
        - answerBreakdown
        - methodology
        - summary
        - createdAt

    CategoryScore:
      type: object
      properties:
        category:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
      required: [category, score]

    AnswerScore:
      type: object
      properties:
        questionId:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
        evidence:
          type: array
          items:
            type: string
        missedSignals:
          type: array
          items:
            type: string
        improvedAnswer:
          type: string
        dimensionScores:
          $ref: "#/components/schemas/DimensionScores"
      required:
        - questionId
        - score
        - evidence
        - missedSignals
        - improvedAnswer
        - dimensionScores

    DimensionScores:
      type: object
      properties:
        relevance: { type: number, minimum: 0, maximum: 100 }
        accuracy: { type: number, minimum: 0, maximum: 100 }
        depth: { type: number, minimum: 0, maximum: 100 }
        structure: { type: number, minimum: 0, maximum: 100 }
        communication: { type: number, minimum: 0, maximum: 100 }
      required: [relevance, accuracy, depth, structure, communication]

    PlanRound:
      type: object
      properties:
        name: { type: string }
        purpose: { type: string }
        focusAreas:
          type: array
          items: { type: string }
        estimatedDays: { type: integer }
      required: [name, purpose, focusAreas, estimatedDays]

    PlanDay:
      type: object
      properties:
        day: { type: integer }
        title: { type: string }
        tasks:
          type: array
          items: { type: string }
      required: [day, title, tasks]

    PlanSource:
      type: object
      properties:
        title: { type: string }
        url: { type: string }
      required: [title, url]

    InterviewPlan:
      type: object
      properties:
        id: { type: string }
        companyName: { type: string, nullable: true }
        jobRole: { type: string }
        experienceLevel: { type: string }
        interviewRounds: { type: integer }
        candidateSummary: { type: string }
        roleSummary: { type: string }
        researchSummary: { type: string }
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/PlanRound"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/PlanDay"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PlanSource"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - jobRole
        - experienceLevel
        - interviewRounds
        - candidateSummary
        - roleSummary
        - researchSummary
        - rounds
        - schedule
        - sources
        - createdAt

    AnalyticsOverview:
      type: object
      properties:
        totalSessions:
          type: integer
        completedSessions:
          type: integer
        averageScore:
          type: number
          nullable: true
        bestScore:
          type: number
          nullable: true
        topCategory:
          type: string
          nullable: true
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        scoresByDifficulty:
          type: object
          properties:
            easy:
              type: number
              nullable: true
            medium:
              type: number
              nullable: true
            hard:
              type: number
              nullable: true
      required:
        - totalSessions
        - completedSessions
        - recentActivity
        - scoresByDifficulty

    HistoryItem:
      type: object
      properties:
        id:
          type: string
        jobRole:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        score:
          type: number
          nullable: true
        questionCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [generating, active, completed, failed]
      required:
        - id
        - jobRole
        - difficulty
        - questionCount
        - startedAt
        - status
